<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Manager — Roadster Admin</title>

<!-- Firebase CDN (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
/* ═══════════════════════════════════════════════════════
   FIRE Deep-Space Glass — Admin Tool
   ═══════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --fire-bg-0:              #07080D;
  --fire-bg-1:              #0E1220;
  --fire-bg-2:              #131A2C;
  --fire-glass:             rgba(255,255,255,0.055);
  --fire-glass-strong:      rgba(255,255,255,0.09);
  --fire-border:            rgba(255,255,255,0.11);
  --fire-border-strong:     rgba(255,255,255,0.18);
  --fire-text-0:            #F5F6FA;
  --fire-text-1:            rgba(245,246,250,0.64);
  --fire-text-2:            rgba(245,246,250,0.38);
  --fire-emerald:           #30D9A0;
  --fire-coral:             #FF6961;
  --fire-azure:             #4DA3FF;
  --fire-amber:             #FFC24D;
  --fire-violet:            #B98CFF;
  --fire-gray:              #8E8E93;
  --fire-shadow:            0 1px 1px rgba(255,255,255,0.06) inset, 0 8px 32px rgba(0,0,0,0.45);
  --fire-input-bg:          rgba(255,255,255,0.05);
  --fire-input-focus-bg:    rgba(255,255,255,0.08);
  --fire-focus-ring:        rgba(77,163,255,0.55);
  --fire-fill-hover:        rgba(255,255,255,0.045);
  --fire-fill-emerald:      rgba(48,217,160,0.14);
  --fire-fill-coral:        rgba(255,105,97,0.18);
  --fire-fill-azure:        rgba(77,163,255,0.08);
  --fire-fill-amber:        rgba(255,194,77,0.14);
  --fire-fill-violet:       rgba(185,140,255,0.12);
  --fire-btn-text:          #06110C;

  --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-base: 240ms;
}

html, body { height:100%; overflow:hidden }
body {
  font-family: var(--font-sans);
  background: radial-gradient(1200px 800px at 15% -10%, #16244a 0%, transparent 60%),
              radial-gradient(1000px 700px at 110% 10%, #1a3a33 0%, transparent 55%),
              radial-gradient(900px 600px at 50% 120%, #2a1a3a 0%, transparent 55%),
              linear-gradient(180deg, #07080D, #0E1220 40%, #131A2C);
  color: var(--fire-text-0);
  -webkit-font-smoothing: antialiased;
}

/* ── Login screen ── */
#loginScreen {
  display:flex; align-items:center; justify-content:center; height:100vh;
}
.login-card {
  background: var(--fire-glass);
  backdrop-filter: blur(30px) saturate(160%);
  border: 1px solid var(--fire-border);
  border-radius: var(--r-lg);
  padding: 48px 40px;
  text-align: center;
  box-shadow: var(--fire-shadow);
  max-width: 420px; width:90%;
}
.login-card h1 { font-size:1.6rem; font-weight:700; letter-spacing:-0.02em; margin-bottom:8px }
.login-card p  { font-size:0.875rem; color:var(--fire-text-1); margin-bottom:32px }
.login-card .badge {
  display:inline-block; padding:3px 10px; font-size:0.7rem; font-weight:600;
  letter-spacing:0.08em; text-transform:uppercase; border-radius:999px;
  background: var(--fire-fill-azure); color: var(--fire-azure);
  border:1px solid rgba(77,163,255,0.20); margin-bottom:28px;
}
.btn-google {
  width:100%; padding:13px 24px; border-radius:var(--r-sm);
  border:1px solid var(--fire-border-strong); cursor:pointer;
  background: rgba(255,255,255,0.06); color:var(--fire-text-0);
  font-size:0.925rem; font-weight:600; font-family:var(--font-sans);
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition: all var(--dur-base) var(--ease-out);
}
.btn-google:hover { background:rgba(255,255,255,0.10); border-color:rgba(255,255,255,0.25) }
.btn-google svg { width:20px; height:20px }
.login-footer { margin-top:28px; font-size:0.75rem; color:var(--fire-text-2) }

/* ── Main app ── */
#appScreen { display:none; height:100vh; flex-direction:column }
#appScreen.visible { display:flex }

/* Topbar */
.topbar {
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px 24px; flex-shrink:0;
  background: var(--fire-glass); backdrop-filter:blur(30px) saturate(160%);
  border-bottom:1px solid var(--fire-border);
}
.topbar-left { display:flex; align-items:center; gap:12px }
.topbar-left h2 { font-size:1.05rem; font-weight:700; letter-spacing:-0.01em }
.topbar-left .dot { width:8px; height:8px; border-radius:50%; background:var(--fire-emerald); animation:pulse 2s infinite }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
.topbar-right { display:flex; align-items:center; gap:12px }
.topbar-right .user-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover }
.topbar-right .user-name { font-size:0.825rem; color:var(--fire-text-1); max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.btn-sm {
  padding:6px 14px; border-radius:var(--r-sm); border:1px solid var(--fire-border);
  background:var(--fire-fill-hover); color:var(--fire-text-1); cursor:pointer;
  font-size:0.78rem; font-weight:600; font-family:var(--font-sans);
  transition:all var(--dur-base) var(--ease-out);
}
.btn-sm:hover { background:rgba(255,255,255,0.08); color:var(--fire-text-0) }
.btn-sm.danger:hover { background:var(--fire-fill-coral); border-color:rgba(255,105,97,0.35); color:var(--fire-coral) }

/* Stats row */
.stats-row {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px; padding:16px 24px; flex-shrink:0;
}
.stat-card {
  background:var(--fire-glass); backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--fire-border); border-radius:var(--r-md);
  padding:16px 18px; box-shadow:var(--fire-shadow);
  transition:all var(--dur-base) var(--ease-out);
}
.stat-card:hover { background:var(--fire-glass-strong) }
.stat-card .stat-label { font-size:0.7rem; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--fire-text-2); margin-bottom:6px }
.stat-card .stat-value { font-size:1.5rem; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums }
.stat-card.emerald  .stat-value { color:var(--fire-emerald) }
.stat-card.coral    .stat-value { color:var(--fire-coral) }
.stat-card.azure    .stat-value { color:var(--fire-azure) }
.stat-card.amber    .stat-value { color:var(--fire-amber) }
.stat-card.violet   .stat-value { color:var(--fire-violet) }
.stat-card .stat-sub { font-size:0.725rem; color:var(--fire-text-2); margin-top:2px }

/* Toolbar */
.toolbar {
  display:flex; align-items:center; gap:10px; padding:0 24px 12px; flex-shrink:0;
  flex-wrap:wrap;
}
.toolbar input, .toolbar select {
  height:36px; padding:0 12px; border-radius:var(--r-sm);
  border:1px solid var(--fire-border); background:var(--fire-input-bg);
  color:var(--fire-text-0); font-size:0.8rem; font-family:var(--font-sans);
  outline:none; transition:all var(--dur-base) var(--ease-out);
}
.toolbar input:focus, .toolbar select:focus {
  border-color:var(--fire-focus-ring); background:var(--fire-input-focus-bg);
}
.toolbar input { width:200px }
.toolbar input::placeholder { color:var(--fire-text-2) }
.toolbar select { cursor:pointer }
.toolbar .spacer { flex:1 }
.btn-tool {
  height:36px; padding:0 14px; border-radius:var(--r-sm);
  border:1px solid var(--fire-border); cursor:pointer;
  font-size:0.78rem; font-weight:600; font-family:var(--font-sans);
  transition:all var(--dur-base) var(--ease-out); white-space:nowrap;
}
.btn-tool { background:var(--fire-fill-hover); color:var(--fire-text-1) }
.btn-tool:hover { background:rgba(255,255,255,0.08); color:var(--fire-text-0) }
.btn-tool.primary { background:var(--fire-fill-azure); border-color:rgba(77,163,255,0.25); color:var(--fire-azure) }
.btn-tool.primary:hover { background:rgba(77,163,255,0.15) }
.btn-tool.emerald { background:var(--fire-fill-emerald); border-color:rgba(48,217,160,0.28); color:var(--fire-emerald) }
.btn-tool.emerald:hover { background:rgba(48,217,160,0.22) }
.batch-bar {
  display:none; align-items:center; gap:8px; padding:0 24px 8px; flex-shrink:0;
}
.batch-bar.visible { display:flex }
.batch-bar .batch-count { font-size:0.8rem; color:var(--fire-azure); font-weight:600 }

/* Table wrapper */
.table-wrap {
  flex:1; overflow:auto; padding:0 24px 12px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.08) transparent;
}
.table-wrap::-webkit-scrollbar { width:6px }
.table-wrap::-webkit-scrollbar-track { background:transparent }
.table-wrap::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.08); border-radius:3px }

table {
  width:100%; border-collapse:separate; border-spacing:0;
  font-size:0.825rem; font-variant-numeric:tabular-nums;
}
thead { position:sticky; top:0; z-index:5 }
thead th {
  text-align:left; padding:10px 12px; font-size:0.7rem; font-weight:700;
  letter-spacing:0.06em; text-transform:uppercase; color:var(--fire-text-2);
  background:var(--fire-glass-strong); backdrop-filter:blur(30px) saturate(160%);
  border-bottom:1px solid var(--fire-border);
  white-space:nowrap; user-select:none; cursor:pointer;
}
thead th:hover { color:var(--fire-text-1) }
thead th .sort-arrow { font-size:0.65rem; margin-left:4px; opacity:0.4 }
thead th.sorted .sort-arrow { opacity:1; color:var(--fire-azure) }
thead th:first-child { padding-left:16px; width:40px; cursor:default }
thead th:first-child:hover { color:var(--fire-text-2) }

tbody td {
  padding:9px 12px; border-bottom:1px solid rgba(255,255,255,0.04);
  color:var(--fire-text-1); vertical-align:middle;
}
tbody td:first-child { padding-left:16px }
tbody tr { transition:background var(--dur-base) var(--ease-out) }
tbody tr:hover { background:var(--fire-fill-hover) }
tbody tr.selected { background:rgba(77,163,255,0.06) }
tbody tr.deleted-row { opacity:0.45 }
tbody tr.deleted-row td { color:var(--fire-text-2); text-decoration:line-through; text-decoration-color:rgba(255,255,255,0.15) }

/* Inline edit */
td[data-editable] { cursor:pointer; border-radius:6px; transition:all 0.15s }
td[data-editable]:hover { background:rgba(255,255,255,0.03); outline:1px dashed rgba(255,255,255,0.12) }
td.editing { padding:0 !important }
td.editing input, td.editing select {
  width:100%; height:100%; padding:9px 12px; border:none; outline:none;
  background:var(--fire-input-focus-bg); color:var(--fire-text-0);
  font-size:0.825rem; font-family:var(--font-sans); border-radius:6px;
  border:1px solid var(--fire-focus-ring);
}
td.editing input:focus, td.editing select:focus { outline:none }

/* Checkbox */
.chk-all, .chk-row { width:16px; height:16px; cursor:pointer; accent-color:var(--fire-azure) }

/* Category badge */
.cat-badge {
  display:inline-block; padding:2px 10px; border-radius:999px; font-size:0.72rem; font-weight:600;
  white-space:nowrap;
}
.cat-badge.cash     { background:rgba(77,163,255,0.12); color:var(--fire-azure) }
.cat-badge.fund     { background:var(--fire-fill-emerald); color:var(--fire-emerald) }
.cat-badge.house    { background:var(--fire-fill-amber); color:var(--fire-amber) }
.cat-badge.car      { background:rgba(142,142,147,0.15); color:var(--fire-gray) }
.cat-badge.crypto   { background:rgba(255,194,77,0.15); color:var(--fire-amber) }
.cat-badge.fixed    { background:var(--fire-fill-violet); color:var(--fire-violet) }
.cat-badge.other    { background:rgba(255,143,171,0.12); color:#FF8FAB }

/* Value */
.val-cell { font-weight:700; color:var(--fire-text-0); font-family:var(--font-mono); font-size:0.8rem }
.note-cell { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.time-cell { font-size:0.72rem; color:var(--fire-text-2); font-family:var(--font-mono) }

/* Deleted toggle */
.del-dot {
  display:inline-block; width:8px; height:8px; border-radius:50%;
  background:var(--fire-gray); transition:background 0.2s;
}
.del-dot.active { background:var(--fire-coral) }

/* Toast */
.toast {
  position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:var(--r-sm);
  background:rgba(20,24,38,0.92); backdrop-filter:blur(20px);
  border:1px solid var(--fire-border); color:var(--fire-text-0);
  font-size:0.8rem; font-weight:600; z-index:999;
  opacity:0; transform:translateY(10px); transition:all var(--dur-base) var(--ease-out);
  pointer-events:none;
}
.toast.show { opacity:1; transform:translateY(0) }
.toast.error { border-color:rgba(255,105,97,0.35); color:var(--fire-coral) }

/* Empty state */
.empty-state { text-align:center; padding:60px 20px; color:var(--fire-text-2) }
.empty-state .empty-icon { font-size:2.5rem; margin-bottom:12px; opacity:0.5 }
.empty-state p { font-size:0.85rem }

/* Loading */
.loading-overlay {
  display:flex; align-items:center; justify-content:center; padding:40px;
  color:var(--fire-text-2); font-size:0.85rem;
}
.spinner { width:20px; height:20px; border:2px solid var(--fire-border); border-top-color:var(--fire-azure); border-radius:50%; animation:spin 0.7s linear infinite; margin-right:10px }
@keyframes spin { to{transform:rotate(360deg)} }

/* ── History Bottom Sheet ── */
.sheet-overlay {
  position:fixed; inset:0; z-index:100;
  background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);
  opacity:0; pointer-events:none;
  transition:opacity var(--dur-base) var(--ease-out);
}
.sheet-overlay.open { opacity:1; pointer-events:auto }

.sheet-panel {
  position:fixed; bottom:0; left:0; right:0; z-index:101;
  max-height:70vh; background:var(--fire-bg-1);
  border-top:1px solid var(--fire-border);
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,0.5);
  display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform 320ms var(--ease-out);
}
.sheet-overlay.open .sheet-panel { transform:translateY(0) }

.sheet-handle {
  width:40px; height:4px; background:rgba(255,255,255,0.18);
  border-radius:2px; margin:12px auto 4px;
}

.sheet-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px 8px;
}
.sheet-header h3 { font-size:1rem; font-weight:700; letter-spacing:-0.01em }
.sheet-close {
  width:32px; height:32px; border-radius:50%; border:none;
  background:rgba(255,255,255,0.06); color:var(--fire-text-1);
  font-size:1.25rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:all var(--dur-base) var(--ease-out);
}
.sheet-close:hover { background:rgba(255,255,255,0.12); color:var(--fire-text-0) }

.sheet-stats {
  display:flex; gap:16px; padding:8px 20px 12px; flex-wrap:wrap;
}
.sheet-stat-item {
  font-size:0.78rem; color:var(--fire-text-2);
}
.sheet-stat-item strong {
  color:var(--fire-text-0); font-weight:700; font-family:var(--font-mono);
}
.sheet-stat-item .up { color:var(--fire-emerald) }
.sheet-stat-item .down { color:var(--fire-coral) }

.sheet-timeline {
  flex:1; overflow-y:auto; padding:0 20px 24px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.08) transparent;
}

/* Timeline item */
.tl-item {
  position:relative; padding-left:28px; padding-bottom:20px;
}
.tl-item:last-child { padding-bottom:4px }

.tl-line {
  position:absolute; left:8px; top:8px; bottom:0;
  width:2px; background:rgba(255,255,255,0.08);
}
.tl-item:last-child .tl-line { bottom:auto; height:24px }

.tl-dot {
  position:absolute; left:3px; top:4px;
  width:12px; height:12px; border-radius:50%;
  background:var(--fire-azure); border:2px solid var(--fire-bg-1);
  box-shadow:0 0 0 2px rgba(77,163,255,0.25);
  z-index:1;
}
.tl-dot.up { background:var(--fire-emerald); box-shadow:0 0 0 2px rgba(48,217,160,0.25) }
.tl-dot.down { background:var(--fire-coral); box-shadow:0 0 0 2px rgba(255,105,97,0.25) }

.tl-time {
  font-size:0.7rem; color:var(--fire-text-2); font-family:var(--font-mono);
  margin-bottom:2px;
}
.tl-body {
  font-size:0.825rem; color:var(--fire-text-1); line-height:1.45;
}
.tl-body .tl-change {
  font-weight:700; font-family:var(--font-mono); font-size:0.8rem;
}
.tl-body .tl-change.up { color:var(--fire-emerald) }
.tl-body .tl-change.down { color:var(--fire-coral) }
.tl-note {
  font-size:0.725rem; color:var(--fire-text-2); margin-top:2px; font-style:italic;
}

/* Responsive */
@media (max-width:768px) {
  .topbar { padding:10px 14px }
  .stats-row { grid-template-columns:repeat(2,1fr); padding:10px 14px; gap:8px }
  .toolbar { padding:0 14px 8px }
  .table-wrap { padding:0 8px 8px }
  .toolbar input { width:140px }
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN SCREEN ═══════════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="badge">Admin Tool</div>
    <h1>Asset Manager</h1>
    <p>登录以管理 Firestore 中的资产数据</p>
    <button class="btn-google" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Sign in with Google
    </button>
    <div class="login-footer">Roadster v2.3 · Firestore Admin</div>
  </div>
</div>

<!-- ═══════════ MAIN APP ═══════════ -->
<div id="appScreen">
  <!-- Topbar -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="dot"></div>
      <h2>Asset Manager</h2>
    </div>
    <div class="topbar-right" id="userInfo"></div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索资产名称..." oninput="applyFilters()">
    <select id="categoryFilter" onchange="applyFilters()">
      <option value="">全部类别</option>
    </select>
    <select id="deletedFilter" onchange="applyFilters()">
      <option value="all">全部状态</option>
      <option value="active">仅活跃</option>
      <option value="deleted">仅已删除</option>
    </select>
    <span class="spacer"></span>
    <button class="btn-tool emerald" onclick="exportCSV()">导出 CSV</button>
    <button class="btn-tool primary" onclick="exportJSON()">导出 JSON</button>
  </div>

  <!-- Batch bar -->
  <div class="batch-bar" id="batchBar">
    <span class="batch-count" id="batchCount"></span>
    <button class="btn-tool danger" onclick="batchSoftDelete()">批量删除</button>
    <button class="btn-tool emerald" onclick="batchRestore()">批量恢复</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" class="chk-all" onchange="toggleSelectAll(this)" title="全选"></th>
          <th data-sort="name" onclick="sortBy('name')">名称 <span class="sort-arrow"></span></th>
          <th data-sort="category" onclick="sortBy('category')">类别 <span class="sort-arrow"></span></th>
          <th data-sort="value" onclick="sortBy('value')">价值(CNY) <span class="sort-arrow"></span></th>
          <th data-sort="note" onclick="sortBy('note')">备注 <span class="sort-arrow"></span></th>
          <th data-sort="createdAt" onclick="sortBy('createdAt')">创建时间 <span class="sort-arrow"></span></th>
          <th data-sort="updatedAt" onclick="sortBy('updatedAt')">更新时间 <span class="sort-arrow"></span></th>
          <th data-sort="deleted" onclick="sortBy('deleted')">状态 <span class="sort-arrow"></span></th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="9"><div class="loading-overlay"><span class="spinner"></span>加载中...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ═══════════ HISTORY BOTTOM SHEET ═══════════ -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
  <div class="sheet-panel" id="sheetPanel" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="sheetAssetName">—</h3>
      <button class="sheet-close" onclick="closeSheet()">&times;</button>
    </div>
    <div class="sheet-stats" id="sheetStats"></div>
    <div class="sheet-timeline" id="sheetTimeline">
      <div class="empty-state"><p>暂无变动记录</p></div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   Asset Manager — Firebase Admin
   ═══════════════════════════════════════════════════════ */

// ── Firebase Config ───────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCFCnb-K042ZmU-W-CozLCA8PhznNLZ-MA",
  authDomain: "roadster988.firebaseapp.com",
  projectId: "roadster988",
  storageBucket: "roadster988.firebasestorage.app",
  messagingSenderId: "447138926799",
  appId: "1:447138926799:web:585c60bd99dd53f807a7ba"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ── Asset Categories ──────────────────────────────────
const CATEGORIES = ['现金/储蓄','基金/股票','房产','车辆','加密货币','固定资产','其他投资'];
const CAT_ICONS = { '现金/储蓄':'🏦','基金/股票':'📈','房产':'🏠','车辆':'🚗','加密货币':'₿','固定资产':'🏗️','其他投资':'💼' };
const CAT_CLASS = {
  '现金/储蓄':'cash', '基金/股票':'fund', '房产':'house', '车辆':'car',
  '加密货币':'crypto', '固定资产':'fixed', '其他投资':'other'
};

// Populate category filter dropdown
(function() {
  const sel = document.getElementById('categoryFilter');
  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = `${CAT_ICONS[c]||''} ${c}`;
    sel.appendChild(opt);
  });
})();

// ── State ─────────────────────────────────────────────
let allAssets = [];
let sortKey = 'updatedAt';
let sortDir = 'desc';
let unsubscribe = null;
let selectedIds = new Set();

// ── Auth ──────────────────────────────────────────────
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').classList.add('visible');
    renderUserInfo(user);
    startListening(user.uid);
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appScreen').classList.remove('visible');
    if (unsubscribe) { unsubscribe(); unsubscribe = null; }
    allAssets = [];
    selectedIds.clear();
    updateBatchBar();
    renderTable();
    renderStats();
  }
});

function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    toast('登录失败: ' + (err.message || '未知错误'), true);
  });
}

function signOut() {
  auth.signOut();
}

function renderUserInfo(user) {
  document.getElementById('userInfo').innerHTML = `
    ${user.photoURL ? `<img class="user-avatar" src="${user.photoURL}" alt="">` : ''}
    <span class="user-name">${user.displayName || user.email || 'User'}</span>
    <button class="btn-sm danger" onclick="signOut()">退出</button>
  `;
}

// ── Firestore Listener ────────────────────────────────
function startListening(uid) {
  if (unsubscribe) unsubscribe();
  const ref = db.collection(`users/${uid}/assets`);
  unsubscribe = ref.onSnapshot(snap => {
    allAssets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    selectedIds.clear();
    updateBatchBar();
    applyFilters();
    renderStats();
  }, err => {
    toast('监听失败: ' + err.message, true);
  });
}

// ── Filter / Sort / Render ────────────────────────────
function getFilteredAssets() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  const catFilter = document.getElementById('categoryFilter').value;
  const delFilter = document.getElementById('deletedFilter').value;

  let arr = [...allAssets];

  if (search) arr = arr.filter(a => (a.name||'').toLowerCase().includes(search));
  if (catFilter) arr = arr.filter(a => a.category === catFilter);
  if (delFilter === 'active') arr = arr.filter(a => !a.deleted);
  if (delFilter === 'deleted') arr = arr.filter(a => a.deleted);

  arr.sort((a,b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'value') { va = Number(va)||0; vb = Number(vb)||0; }
    if (sortKey === 'deleted') { va = va ? 1 : 0; vb = vb ? 1 : 0; }
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  return arr;
}

function applyFilters() {
  renderTable();
  renderStats();
}

function sortBy(key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = key === 'name' || key === 'category' ? 'asc' : 'desc'; }
  updateSortHeaders();
  renderTable();
}

function updateSortHeaders() {
  document.querySelectorAll('thead th[data-sort]').forEach(th => {
    th.classList.toggle('sorted', th.dataset.sort === sortKey);
    const arrow = th.querySelector('.sort-arrow');
    if (arrow) arrow.textContent = th.dataset.sort === sortKey ? (sortDir==='asc'?'▲':'▼') : '';
  });
}

// ── Render Table ──────────────────────────────────────
let editingCell = null;

function renderTable() {
  const assets = getFilteredAssets();
  const tbody = document.getElementById('tableBody');
  const chkAll = document.querySelector('.chk-all');
  chkAll.checked = assets.length > 0 && assets.every(a => selectedIds.has(a.id));

  if (assets.length === 0) {
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">📭</div><p>暂无资产数据</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = assets.map(a => {
    const sel = selectedIds.has(a.id);
    const delClass = a.deleted ? ' deleted-row' : '';
    const catIcon = CAT_ICONS[a.category] || '';
    const catCls = CAT_CLASS[a.category] || 'other';
    return `
    <tr class="${sel ? 'selected' : ''}${delClass}" data-id="${a.id}">
      <td><input type="checkbox" class="chk-row" ${sel ? 'checked' : ''} onchange="toggleSelect('${a.id}', this)"></td>
      <td data-editable data-field="name" onclick="startEdit(this,'${a.id}','name')">${esc(a.name||'—')}</td>
      <td data-editable data-field="category" onclick="startEdit(this,'${a.id}','category')"><span class="cat-badge ${catCls}">${catIcon} ${esc(a.category||'—')}</span></td>
      <td data-editable data-field="value" onclick="startEdit(this,'${a.id}','value')" class="val-cell">${fmtNum(a.value)}</td>
      <td data-editable data-field="note" onclick="startEdit(this,'${a.id}','note')" class="note-cell" title="${esc(a.note||'')}">${esc(a.note||'—')}</td>
      <td class="time-cell">${fmtTime(a.createdAt)}</td>
      <td class="time-cell">${fmtTime(a.updatedAt)}</td>
      <td><span class="del-dot${a.deleted?' active':''}" title="${a.deleted?'已删除':'活跃'}"></span></td>
      <td><button class="btn-tool" onclick="openHistory('${a.id}')" title="查看价值变动历史">历史</button></td>
    </tr>`;
  }).join('');
}

function startEdit(td, id, field) {
  if (editingCell) return; // one at a time
  const asset = allAssets.find(a => a.id === id);
  if (!asset) return;

  const origVal = asset[field];
  editingCell = { td, id, field, origVal };
  td.classList.add('editing');
  td.innerHTML = '';

  if (field === 'category') {
    const sel = document.createElement('select');
    CATEGORIES.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = `${CAT_ICONS[c]||''} ${c}`;
      if (c === origVal) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener('blur', () => commitEdit());
    sel.addEventListener('keydown', e => { if (e.key==='Escape') cancelEdit(); });
    sel.addEventListener('change', () => commitEdit());
    td.appendChild(sel);
    sel.focus();
  } else {
    const input = document.createElement('input');
    input.type = field === 'value' ? 'number' : 'text';
    if (field === 'value') { input.step = '0.01'; input.min = '0'; }
    input.value = field === 'value' ? (origVal||0) : (origVal||'');
    input.addEventListener('blur', () => commitEdit());
    input.addEventListener('keydown', e => {
      if (e.key==='Enter') commitEdit();
      if (e.key==='Escape') cancelEdit();
    });
    td.appendChild(input);
    input.focus();
    input.select();
  }
}

async function commitEdit() {
  if (!editingCell) return;
  const { td, id, field, origVal } = editingCell;

  const input = td.querySelector('input, select');
  let newVal = input ? input.value : '';
  if (field === 'value') newVal = parseFloat(newVal) || 0;

  // No change
  if (String(newVal) === String(origVal ?? '')) {
    cancelEdit();
    return;
  }

  // Optimistic update
  const idx = allAssets.findIndex(a => a.id === id);
  if (idx !== -1) allAssets[idx][field] = field === 'value' ? newVal : newVal;

  editingCell = null;
  td.classList.remove('editing');
  td.innerHTML = '';

  // Render just this row temporarily via full re-render
  renderTable();
  renderStats();

  // Persist to Firestore
  const user = auth.currentUser;
  if (!user) { toast('未登录', true); return; }
  try {
    const update = { [field]: field === 'value' ? newVal : newVal, updatedAt: new Date().toISOString() };
    await db.collection(`users/${user.uid}/assets`).doc(id).update(update);
    toast('已保存');
  } catch (err) {
    // Revert on failure (onSnapshot will fix it anyway)
    toast('保存失败: ' + err.message, true);
  }
}

function cancelEdit() {
  if (!editingCell) return;
  const { td } = editingCell;
  editingCell = null;
  td.classList.remove('editing');
  td.innerHTML = '';
  renderTable(); // full re-render to restore
}

document.addEventListener('click', e => {
  if (editingCell && !editingCell.td.contains(e.target)) {
    commitEdit();
  }
});

// ── Selection ─────────────────────────────────────────
function toggleSelect(id, cb) {
  if (cb.checked) selectedIds.add(id);
  else selectedIds.delete(id);
  updateBatchBar();
  // Update row highlight
  const tr = cb.closest('tr');
  if (tr) tr.classList.toggle('selected', cb.checked);
  const chkAll = document.querySelector('.chk-all');
  const assets = getFilteredAssets();
  chkAll.checked = assets.length > 0 && assets.every(a => selectedIds.has(a.id));
}

function toggleSelectAll(cb) {
  const assets = getFilteredAssets();
  if (cb.checked) assets.forEach(a => selectedIds.add(a.id));
  else assets.forEach(a => selectedIds.delete(a.id));
  updateBatchBar();
  renderTable();
}

function updateBatchBar() {
  const bar = document.getElementById('batchBar');
  const count = document.getElementById('batchCount');
  if (selectedIds.size > 0) {
    bar.classList.add('visible');
    count.textContent = `已选择 ${selectedIds.size} 项`;
  } else {
    bar.classList.remove('visible');
  }
}

// ── Batch Operations ──────────────────────────────────
async function batchSoftDelete() {
  if (selectedIds.size === 0) return;
  const user = auth.currentUser;
  if (!user) { toast('未登录', true); return; }

  const ids = [...selectedIds];
  try {
    const batch = db.batch();
    const now = new Date().toISOString();
    ids.forEach(id => {
      batch.update(db.collection(`users/${user.uid}/assets`).doc(id), { deleted: true, updatedAt: now });
    });
    await batch.commit();
    toast(`已删除 ${ids.length} 项`);
    selectedIds.clear();
    updateBatchBar();
    // onSnapshot will refresh
  } catch (err) {
    toast('批量删除失败: ' + err.message, true);
  }
}

async function batchRestore() {
  if (selectedIds.size === 0) return;
  const user = auth.currentUser;
  if (!user) { toast('未登录', true); return; }

  const ids = [...selectedIds];
  try {
    const batch = db.batch();
    const now = new Date().toISOString();
    ids.forEach(id => {
      batch.update(db.collection(`users/${user.uid}/assets`).doc(id), { deleted: false, updatedAt: now });
    });
    await batch.commit();
    toast(`已恢复 ${ids.length} 项`);
    selectedIds.clear();
    updateBatchBar();
  } catch (err) {
    toast('批量恢复失败: ' + err.message, true);
  }
}

// ── Export ────────────────────────────────────────────
function exportJSON() {
  const assets = getFilteredAssets();
  const data = assets.map(a => ({
    id: a.id, name: a.name, category: a.category, value: a.value,
    note: a.note, createdAt: a.createdAt, updatedAt: a.updatedAt,
    deviceId: a.deviceId, version: a.version, deleted: a.deleted
  }));
  downloadFile('assets-export.json', JSON.stringify(data, null, 2), 'application/json');
}

function exportCSV() {
  const assets = getFilteredAssets();
  const headers = ['id','name','category','value','note','createdAt','updatedAt','deviceId','version','deleted'];
  const rows = assets.map(a => headers.map(h => {
    let v = a[h] ?? '';
    if (typeof v === 'string' && (v.includes(',') || v.includes('"') || v.includes('\n'))) {
      v = '"' + v.replace(/"/g, '""') + '"';
    }
    return v;
  }));
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  downloadFile('assets-export.csv', '\uFEFF' + csv, 'text/csv;charset=utf-8');
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(`已导出: ${filename}`);
}

// ── Stats ─────────────────────────────────────────────
function renderStats() {
  const active = allAssets.filter(a => !a.deleted);
  const deleted = allAssets.filter(a => a.deleted);
  const totalValue = active.reduce((s,a) => s + (Number(a.value)||0), 0);

  // Category breakdown (active only)
  const catMap = {};
  active.forEach(a => {
    const cat = a.category || '其他';
    catMap[cat] = (catMap[cat]||0) + (Number(a.value)||0);
  });

  const container = document.getElementById('statsRow');
  let html = `
    <div class="stat-card azure">
      <div class="stat-label">总资产数</div>
      <div class="stat-value">${active.length}</div>
      <div class="stat-sub">活跃资产</div>
    </div>
    <div class="stat-card emerald">
      <div class="stat-label">总价值</div>
      <div class="stat-value">${fmtNum(totalValue)}</div>
      <div class="stat-sub">CNY</div>
    </div>`;

  if (deleted.length > 0) {
    html += `
    <div class="stat-card coral">
      <div class="stat-label">已删除</div>
      <div class="stat-value">${deleted.length}</div>
      <div class="stat-sub">软删除标记</div>
    </div>`;
  }

  // Top categories
  const sorted = Object.entries(catMap).sort((a,b) => b[1]-a[1]).slice(0,4);
  const catColors = { '现金/储蓄':'azure', '基金/股票':'emerald', '房产':'amber', '车辆':'coral', '加密货币':'amber', '固定资产':'violet', '其他投资':'coral' };
  sorted.forEach(([cat, val]) => {
    const color = catColors[cat] || 'azure';
    const icon = CAT_ICONS[cat] || '';
    html += `
    <div class="stat-card ${color}">
      <div class="stat-label">${icon} ${cat}</div>
      <div class="stat-value">${fmtNum(val)}</div>
      <div class="stat-sub">${active.length ? ((val/totalValue)*100).toFixed(1) : 0}%</div>
    </div>`;
  });

  container.innerHTML = html;
}

// ── Asset History Bottom Sheet ──────────────────────
let _historyUnsub = null;
let _currentHistoryAssetId = null;

async function openHistory(assetId) {
  try {
    const asset = allAssets.find(a => a.id === assetId);
    if (!asset) { toast('未找到该资产', true); return; }

    _currentHistoryAssetId = assetId;
    document.getElementById('sheetAssetName').textContent = asset.name || '未命名';

    document.getElementById('sheetStats').innerHTML = `
      <span class="sheet-stat-item">当前价值 <strong>${fmtNum(asset.value)}</strong> CNY</span>
    `;

    document.getElementById('sheetOverlay').classList.add('open');
    document.getElementById('sheetTimeline').innerHTML = '<div class="loading-overlay"><span class="spinner"></span>加载变动记录...</div>';

    if (_historyUnsub) _historyUnsub();
    const user = auth.currentUser;
    if (!user) {
      document.getElementById('sheetTimeline').innerHTML = '<div class="empty-state"><p>请先登录</p></div>';
      return;
    }

    const ref = db.collection('users').doc(user.uid).collection('assets').doc(assetId).collection('snapshots');
    _historyUnsub = ref.onSnapshot(snap => {
      const snapshots = [];
      snap.forEach(doc => { snapshots.push({ id: doc.id, ...doc.data() }); });
      snapshots.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
      renderTimeline(snapshots, asset);
    }, err => {
      console.error('History onSnapshot error:', err);
      document.getElementById('sheetTimeline').innerHTML = `<div class="empty-state"><p>加载失败: ${esc(err.message || '未知错误')}</p>
        <p style="font-size:12px;margin-top:8px;color:var(--fire-text-2)">可能需要更新 Firestore 安全规则以允许读取 snapshots 子集合</p></div>`;
    });
  } catch (err) {
    console.error('openHistory error:', err);
    document.getElementById('sheetTimeline').innerHTML = `<div class="empty-state"><p>打开失败: ${esc(err.message || String(err))}</p></div>`;
  }
}

function closeSheet(event) {
  if (event && event.target !== document.getElementById('sheetOverlay')) return;
  document.getElementById('sheetOverlay').classList.remove('open');
  if (_historyUnsub) { _historyUnsub(); _historyUnsub = null; }
  _currentHistoryAssetId = null;
}

function renderTimeline(snapshots, asset) {
  const container = document.getElementById('sheetTimeline');
  const currentValue = Number(asset.value) || 0;
  let totalChange = 0;

  // Calculate total change
  snapshots.forEach(s => {
    totalChange += (Number(s.newValue) || 0) - (Number(s.previousValue) || 0);
  });

  // Update stats
  const changeClass = totalChange >= 0 ? 'up' : 'down';
  const changeSign = totalChange >= 0 ? '+' : '';
  document.getElementById('sheetStats').innerHTML = `
    <span class="sheet-stat-item">当前价值 <strong>${fmtNum(currentValue)}</strong> CNY</span>
    <span class="sheet-stat-item">总变动 <strong class="${changeClass}">${changeSign}${fmtNum(totalChange)}</strong> CNY</span>
    <span class="sheet-stat-item">共 <strong>${snapshots.length}</strong> 条记录</span>
  `;

  if (snapshots.length === 0) {
    container.innerHTML = '<div class="empty-state"><p>暂无变动记录</p></div>';
    return;
  }

  container.innerHTML = snapshots.map(s => {
    const prev = Number(s.previousValue) || 0;
    const next = Number(s.newValue) || 0;
    const diff = next - prev;
    const dirClass = diff >= 0 ? 'up' : 'down';
    const sign = diff >= 0 ? '+' : '';
    const note = s.note || '';

    return `
    <div class="tl-item">
      <div class="tl-line"></div>
      <div class="tl-dot ${dirClass}"></div>
      <div class="tl-time">${fmtTimeFull(s.timestamp)}</div>
      <div class="tl-body">
        ${fmtNum(prev)} <span style="color:var(--fire-text-2)">→</span> ${fmtNum(next)}
        &nbsp;<span class="tl-change ${dirClass}">${sign}${fmtNum(diff)}</span>
      </div>
      ${note ? `<div class="tl-note">${esc(note)}</div>` : ''}
    </div>`;
  }).join('');
}

// ── Helpers ───────────────────────────────────────────
function esc(s) { if (!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function fmtNum(n) { const v=Number(n)||0; return v.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function fmtTime(ts) {
  if (!ts) return '—';
  try {
    const d = new Date(ts);
    return d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}) + ' ' +
           d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  } catch { return ts; }
}

function fmtTimeFull(ts) {
  if (!ts) return '—';
  try {
    const d = new Date(ts);
    return d.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}) + ' ' +
           d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  } catch { return ts; }
}

// Toast
let toastTimer;
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (isError ? ' error' : '') + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// Init sort headers
updateSortHeaders();
</script>
</body>
</html>
